name: opfan
description: One Piece Fan App - Explore the world of One Piece characters and Devil Fruits.

publish_to: 'none' 

version: 2.0.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  json_annotation: ^4.8.1
  intl: ^0.20.2
  json_serializable: ^6.7.1
  path_provider: ^2.1.1
  math_expressions: ^2.4.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7
  video_player: ^2.8.2
  youtube_player_flutter: ^10.0.1
  cached_network_image: ^3.3.1
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0
  get_it: ^7.6.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.10
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^22.0.0
  cloud_functions: ^5.4.0
  google_sign_in: ^6.2.1
  palette_generator: ^0.3.3+2
  google_generative_ai: ^0.3.0
  image: ^4.1.3
  uuid: ^4.5.1
  fl_chart: ^1.0.0
  url_launcher: ^6.2.5
  stylish_bottom_bar: ^1.1.1
  markdown_widget: ^2.3.2+8
  phosphoricons_flutter: ^1.0.0
  flutter_gemma: ^1.1.1
  flutter_gemma_litertlm: ^1.0.2
  flutter_gemma_embeddings: ^1.0.1
  flutter_gemma_rag_sqlite: ^1.1.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  test: ^1.24.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.5.1
  build_runner: ^2.5.4
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/
    - assets/logo/
    - assets/icons/
    - assets/svg/
    - .env

  fonts:
    - family: Lato
      fonts:
        - asset: fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: fonts/Montserrat-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: fonts/Montserrat-ExtraLight.ttf
          weight: 300
        - asset: fonts/Montserrat-ExtraLightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: fonts/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Montserrat-Black.ttf
          weight: 900
        - asset: fonts/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic

    - family: OnePieceIcons
      fonts:
      - asset: assets/icons/OnePieceIcons.ttf