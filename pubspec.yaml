name: simple_app
description: A new Flutter project.

publish_to: 'none' 

version: 1.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  json_serializable: ^6.7.1
  path_provider: ^2.1.1
  provider: ^6.1.1
  math_expressions: ^2.4.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

dev_dependencies:
  test: ^1.24.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  mockito: ^5.4.2
  build_runner: ^2.5.4
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/
    - assets/logo/
    - assets/icons/    

  fonts:
    - family: Lato
      fonts:
        - asset: fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: fonts/Montserrat-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: fonts/Montserrat-ExtraLight.ttf
          weight: 300
        - asset: fonts/Montserrat-ExtraLightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: fonts/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Montserrat-Black.ttf
          weight: 900
        - asset: fonts/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic

    - family: OnePieceIcons
      fonts:
      - asset: assets/icons/OnePieceIcons.ttf